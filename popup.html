<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DevOps Finder</title>
  <link rel="stylesheet" href="popup.css">
  <script src="popup.js" defer></script>
</head>
<body>
  <header>
    <div class="brand"><img class="mark" src="images/devops-finder.svg" alt="" width="28" height="28"> DevOps Finder</div>
    <div class="header-actions">
      <button id="theme-toggle" type="button" aria-label="Switch theme">
        <span class="material-symbols-rounded moon" aria-hidden="true">dark_mode</span>
        <span class="material-symbols-rounded sun" aria-hidden="true">light_mode</span>
      </button>
      <button id="settings" type="button" aria-label="Settings" title="Settings">
        <span class="material-symbols-rounded" aria-hidden="true">settings</span>
      </button>
    </div>
  </header>
  <main>
    <div class="search-field">
      <span class="material-symbols-rounded" aria-hidden="true">search</span>
      <input id="search" type="search" aria-label="Search projects or repositories by name" placeholder="Search projects or repositories…" autocomplete="off" autofocus>
    </div>
    <button id="advanced" type="button" aria-controls="filters" aria-expanded="false">Advanced search <span class="material-symbols-rounded" aria-hidden="true">expand_more</span></button>
    <div id="filters" hidden>
      <label>Collection<span class="select-control"><select id="collection"></select><span class="material-symbols-rounded select-chevron" aria-hidden="true">expand_more</span></span></label>
      <label>Project<span class="select-control"><select id="project"></select><span class="material-symbols-rounded select-chevron" aria-hidden="true">expand_more</span></span></label>
      <label>Repository<span class="select-control"><select id="repository"></select><span class="material-symbols-rounded select-chevron" aria-hidden="true">expand_more</span></span></label>
      <button id="clear-filters" class="clear-filters" type="button">Clear filters</button>
    </div>
    <p id="status" role="status">Loading projects and repositories…</p>
    <div id="error" role="alert" hidden></div>
    <h2 id="results-heading" class="results-heading">Collections</h2>
    <ul id="results" aria-labelledby="results-heading"></ul>
  </main>
  <footer class="status-bar" aria-label="Extension status">
    <small id="connected-server" class="connected-server"></small>
    <small id="session" class="session" role="status" data-state="unconfigured" aria-label="No server selected: Not configured" title="No server selected: Not configured">Not configured</small>
    <button id="version" class="status-version" type="button" popovertarget="github-popover" aria-haspopup="dialog" title="About DevOps Finder"></button>
  </footer>
  <div id="github-popover" class="github-popover" popover="auto" role="dialog" aria-labelledby="github-popover-title">
    <div class="github-popover-heading">
      <strong id="github-popover-title">Enjoying DevOps Finder?</strong>
      <button class="settings-close" type="button" popovertarget="github-popover" popovertargetaction="hide" aria-label="Close" title="Close">
        <span class="material-symbols-rounded" aria-hidden="true">close</span>
      </button>
    </div>
    <p>If it helps your work, please consider giving the project a star.</p>
    <a href="https://github.com/hsdutra/devops-finder" target="_blank" rel="noopener noreferrer">Star DevOps Finder on GitHub</a>
  </div>
  <dialog id="settings-dialog" aria-labelledby="settings-title">
    <form id="settings-form">
      <div class="settings-heading">
        <h2 id="settings-title">Azure DevOps settings</h2>
        <button id="settings-close" class="settings-close" type="button" aria-label="Close settings" title="Close settings">
          <span class="material-symbols-rounded" aria-hidden="true">close</span>
        </button>
      </div>
      <div class="connections-toolbar">
        <span id="connections-label">Saved server URLs</span>
        <button id="add-server" type="button">Add URL</button>
      </div>
      <table id="connections-grid" class="connections-grid" aria-labelledby="connections-label">
        <thead><tr><th scope="col">Active</th><th scope="col">URL</th><th scope="col">Actions</th></tr></thead>
        <tbody id="saved-servers"></tbody>
      </table>
      <div id="new-server" hidden>
        <label for="server-url">Organization, server or collection URL</label>
        <input id="server-url" type="url" disabled placeholder="https://dev.azure.com/my-organization">
      </div>
      <p id="settings-error" role="alert" hidden></p>
      <div id="settings-actions" class="error-actions" hidden>
        <button id="settings-cancel" type="button">Cancel</button>
        <button type="submit">Save</button>
      </div>
    </form>
  </dialog>
</body>
</html>
